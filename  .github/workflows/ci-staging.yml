name: CI - Staging

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: asia-southeast1-docker.pkg.dev
  IMAGE_NAME: maliev-website/maliev-services/compliance-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Configure NuGet
      run: |
        dotnet nuget update source github \
          --username ${{ secrets.NUGET_USERNAME }} \
          --password ${{ secrets.GITOPS_PAT }} \
          --store-password-in-clear-text \
          --configfile nuget.config

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

    - name: Build and push Docker image
      run: |
        docker build \
          --secret id=nuget_username,env=NUGET_USERNAME \
          --secret id=nuget_password,env=NUGET_PASSWORD \
          -f Maliev.ComplianceService.Api/Dockerfile \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest \
          .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
      env:
        NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
        NUGET_PASSWORD: ${{ secrets.GITOPS_PAT }}
        DOCKER_BUILDKIT: 1

    - name: Update GitOps repository
      run: |
        git clone https://oauth2:${{ secrets.GITOPS_PAT }}@github.com/MALIEV-Co-Ltd/maliev-gitops.git
        cd maliev-gitops
        sed -i "s|image:.*compliance-service:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}|g" environments/staging/compliance-service/deployment.yaml
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add environments/staging/compliance-service/deployment.yaml
        git commit -m "Update compliance-service to staging-${{ github.sha }}"
        git push
