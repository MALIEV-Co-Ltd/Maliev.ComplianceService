name: Reusable Validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Compliance service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: service
          persist-credentials: false
      - name: Checkout shared Aspire defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: d79f954b2e7224b48bec75af4826bb38dd5f2a20
          path: Maliev.Aspire
          persist-credentials: false
      - name: Checkout shared messaging contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 2347023e8aa17dfd7071317c2ee5c4436e1d945a
          path: Maliev.MessagingContracts
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet restore Maliev.ComplianceService.slnx --configfile nuget.validation.config
      - name: Audit dependencies
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet list Maliev.ComplianceService.slnx package --vulnerable --include-transitive --no-restore
      - name: Verify formatting
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet format Maliev.ComplianceService.slnx --verify-no-changes --no-restore
      - name: Build
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet build Maliev.ComplianceService.slnx --configuration Release --no-restore
      - name: Test
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet test Maliev.ComplianceService.slnx --configuration Release --no-build --no-restore --verbosity normal
      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks
          ./gitleaks dir service --no-banner --redact
